      metin: |-
        ## TropoVisc<sup>&trade;</sup> nedir?

        TropoVisc<sup>&trade;</sup>, Tropocells<sup>&reg;</sup> PRP'nin etkinliğini enjeksiyon bölgesinde daha uzun süre korumak için geliştirilen otolog, biyolojik bir hücre taşıyıcı sistemidir. Literatürde "otolog viskö suplementasyon" olarak tanımlanır.

        ## Nasıl çalışır?

        Hastanın kanından ayrıştırılan trombositten fakir plazma (PPP), 100 derecede 10 dakika ısıtılarak denatüre edilir. Albümin proteinleri yapısal değişime uğrayarak yavaş rezorbe olan yoğun bir protein iskeleti oluşturur; bu iskelet iki aya kadar yerinde kalır.

        Tropocells<sup>&reg;</sup> PRP ile karıştırılıp enjekte edildiğinde PRP enjeksiyon bölgesinde tutulur ve büyüme faktörü salınımı uzatılır.

        ## Avantajlar
