ad: TropoVisc
ozet: >-
  Tropocells PRP'nin etkisini enjeksiyon bölgesinde koruyan otolog taşıyıcı
  sistem.
aile: tropocells
sira: 8
gizli: false
gorsel: /assets/img/urunler/tropovisc/gorsel.png
gorselAlt: Tropocells PRP tüpleri ve enjektör
bloklar:
  - discriminant: etiketler
    value:
      etiketler:
        - Otolog
        - Viskö suplementasyon
        - Ek donanım gerektirmez
  - discriminant: metin
    value:
      metin: >-
        ## TropoVisc nedir?


        TropoVisc, Tropocells PRP'nin etkinliğini enjeksiyon bölgesinde daha
        uzun süre korumak için geliştirilen otolog, biyolojik bir hücre taşıyıcı
        sistemidir. Literatürde "otolog viskö suplementasyon" olarak tanımlanır.


        ## Nasıl çalışır?


        Hastanın kanından ayrıştırılan trombositten fakir plazma (PPP), 100
        derecede 10 dakika ısıtılarak denatüre edilir. Albümin proteinleri
        yapısal değişime uğrayarak yavaş rezorbe olan yoğun bir protein iskeleti
        oluşturur; bu iskelet iki aya kadar yerinde kalır.


        Tropocells PRP ile karıştırılıp enjekte edildiğinde PRP enjeksiyon
        bölgesinde tutulur ve büyüme faktörü salınımı uzatılır.


        ## Avantajlar
  - discriminant: maddeler
    value:
      maddeler:
        - '%100 doğal ve otolog, kişinin kendi kanından hazırlanır'
        - PRP'nin etki süresini iki aya kadar uzatır
        - Protein iskeleti yeni doku oluşumuna rehberlik eder
        - Tek seansta viskö suplementasyon ve büyüme faktörü tedavisi
        - Minimal invaziv, hızlı hazırlama süreci
        - >-
          Standart Tropocells<sup>&reg;</sup> PRP kitinden ek donanım
          gerektirmez
  - discriminant: metin
    value:
      metin: '## Uygulama alanları'
  - discriminant: maddeler
    value:
      maddeler:
        - Eklem dejenerasyonu ve osteoartrit (diz, kalça, omuz)
        - Tendon ve bağ yaralanmaları
        - Uzun süreli etki gerektiren sporcu vakaları
        - Zor iyileşen kronik yaralar
