ad: TropoVet
ozet: Veteriner hekimlik alanına özel geliştirilmiş PRGF teknolojisi.
aile: tropocells
sira: 11
gizli: false
gorsel: /assets/img/urunler/tropovet/gorsel.jpg
gorselAlt: TropoVet tüpü ve enjektörü
bloklar:
  - discriminant: etiketler
    value:
      etiketler:
        - Otolog
        - Sadece PRGF teknolojisi
        - Uluslararası sertifikalı üretim
  - discriminant: metin
    value:
      metin: >-
        ## TropoVet nedir?


        TropoVet, veteriner hekimlik alanına özel geliştirilmiş PRGF (Platelet
        Rich Growth Factors) teknolojisi ürünüdür. Köpek, kedi ve atlarda eklem
        dejenerasyonu, yara iyileşmesi ve doku onarımı uygulamalarında
        kullanılır.


        ## Uygulama alanları
  - discriminant: maddeler
    value:
      maddeler:
        - Eklem dejenerasyonu ve osteoartrit (köpek, at)
        - Tendon ve ligaman yaralanmaları
        - Cerrahi sonrası doku iyileşmesi
        - Cilt yaraları ve kronik ülserler
  - discriminant: metin
    value:
      metin: '## Neden TropoVet?'
  - discriminant: maddeler
    value:
      maddeler:
        - Sadece PRGF teknolojisi, en saf büyüme faktörü konsantresi
        - Hayvan için güvenli, komplikasyonsuz protokol
        - Klinik çalışmalarla desteklenmiş
        - Uluslararası sertifikalı üretim
  - discriminant: not
    value:
      vurgu: 'Hedef klinikler:'
      metin: >-
        Özel veteriner klinikleri ve ortopedi odaklı veteriner hekimler. Klinik
        bazlı eğitim ve uygulama desteği için ekibimize yazabilirsiniz.
      ustBosluk: 26
