  - discriminant: metin
    value:
      metin: |-
        ## Cellenis<sup>&reg;</sup> nedir?

        Cellenis<sup>&reg;</sup>, İspanya'da Bioteck tarafından geliştirilen ve PRGF (Platelet Rich Growth Factors) teknolojisini temel alan otolog biyolojik tedavi platformudur.

        Kişinin kendi kanından veya plazmasından elde edilen Cellenis<sup>&reg;</sup> ürünleri yabancı madde içermez, alerjik reaksiyon riski taşımaz ve uzun süreli, doğal iyileşme sürecini destekler.

        ## Sistemi ayıran nokta

        Cellenis<sup>&reg;</sup> sistemi, standart laboratuvar tüplerinden farklı olarak yalnızca kan ayrıştırmak için değil, biyolojik ürünün güvenli şekilde hazırlanıp yeniden uygulanmasına yönelik geliştirilmiş patentli bir medikal sistemdir.
  - discriminant: maddeler
    value:
      baslik: ""
      maddeler:
        - "Patentli jel bariyer teknolojisi ile yüksek saflıkta plazma"
        - "Özel cam tüp yapısı, trombositlerin plazmaya etkin geçişi"
        - "Kan alımından uygulamaya kapalı sistem çalışma prensibi"
        - "Standartlaştırılmış ayrıştırma süreci, tekrarlanabilir sonuç"
  - discriminant: metin
    value:
      metin: |-
        ## Ürün ailesi
  - discriminant: kutular
    value:
      baslik: ""
      ustBosluk: 0
      kutular:
        - baslik: "Cellenis<sup>&reg;</sup> PRGF"
          metin: "Lökosit içermeyen, büyüme faktörü açısından zenginleştirilmiş sıvı plazma fraksiyonu. Enjekte edilebilir, hızlı etkilidir."
          maddeler: []
        - baslik: "Cellenis<sup>&reg;</sup> PRF"
          metin: "Pıhtılaşma ve büyüme faktörlerini içeren fibrin membran. Yavaş salınımlıdır, fiziksel bariyer görevi görür."
          maddeler: []
        - baslik: "Cellenis<sup>&reg;</sup> DermaFiller"
          metin: "Kişinin kendi plazmasından üretilen otolog biyolojik dolgu. Hacim desteği ile rejeneratif etkiyi birlikte sunar."
          maddeler: []
        - baslik: "Cellenis<sup>&reg;</sup> Exo&#8209;ME"
          metin: "Mezenkimal kök hücrelerden elde edilen ekzozomlar. Hücre içermez, bağışıklık sistemi tepkisi oluşturmaz."
          maddeler: []
  - discriminant: metin
    value:
      metin: |-
        <p style="margin-top:26px">Rejeneratif cerrahi tarafında <a href="/svf">SVF</a> uygulamaları da bu platformun tamamlayıcısıdır.</p>
