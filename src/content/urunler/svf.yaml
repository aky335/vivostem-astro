  - discriminant: metin
    value:
      metin: |-
        ## SVF nedir?

        SVF (Stromal Vasküler Fraksiyon), mini liposuction ile alınan yağ dokusundan elde edilen ve mezenkimal kök hücreler, endotel öncü hücreler ile büyüme faktörleri içeren biyolojik bir konsantredir.

        ## Uygulama alanları
  - discriminant: maddeler
    value:
      baslik: ""
      maddeler:
        - "Eklem dejenerasyonu (diz, kalça, omuz)"
        - "Cilt rejenerasyonu"
        - "Estetik ve rekonstrüktif cerrahi"
        - "Yaralanma sonrası doku onarımı"
  - discriminant: not
    value:
      vurgu: "Not:"
      metin: "SVF, Cellenis<sup>&reg;</sup> platformunun rejeneratif cerrahi tarafındaki tamamlayıcısıdır. Ortopedik uygulamalarda kemik iliği kaynaklı alternatifi için <a href=\"/bmac\">BMAC</a> sayfasına bakabilirsiniz."
      ustBosluk: 26
