        - "Otolog"
        - "Lökositsiz"
        - "Enjekte edilebilir"
        - "FDA ve CE onaylı"
  - discriminant: metin
    value:
      metin: |-
        ## PRGF nedir?

        PRGF (Plasma Rico en Factores de Crecimiento), trombositler tarafından salgılanan büyüme faktörlerinden arındırılmamış, yalnızca büyüme faktörü açısından zenginleştirilmiş plazma fraksiyonudur.

        Standart PRP'den temel farkı lökosit içermemesidir. Bu sayede enflamasyon riski en aza iner; doku iyileşmesi daha kontrollü ve öngörülebilir ilerler.

        ## Endikasyonlar
  - discriminant: kutular
    value:
      baslik: ""
      ustBosluk: 0
      kutular:
        - baslik: "Dermatoloji"
          metin: ""
          maddeler:
            - "Yüz gençleştirme"
            - "Saç dökülmesi"
        - baslik: "Estetik tıp"
          metin: ""
          maddeler:
            - "Dolgu kombinasyonu"
            - "Cilt kalitesi"
        - baslik: "Diş hekimliği"
          metin: ""
          maddeler:
            - "İmplant iyileşmesi"
            - "Kemik rejenerasyonu"
        - baslik: "Ortopedi"
          metin: ""
          maddeler:
            - "Eklem dejenerasyonu"
            - "Tendon yaralanmaları"
  - discriminant: kutular
    value:
      baslik: ""
      ustBosluk: 20
      kutular:
        - baslik: "Oftalmoloji"
          metin: ""
          maddeler:
