        ## TRS nedir?

        TRS (Thrombin&#8209;Rich Serum), hastanın kendi kanından elde edilen otolog bir üründür. Kanın pıhtılaşma sürecindeki kilit enzim olan trombin bakımından zengindir.

        Kalsiyum glukonat eklenerek pıhtılaşma süreci tetiklenir ve PDGF, TGF&#8209;beta gibi büyüme faktörleri serbest bırakılır.

