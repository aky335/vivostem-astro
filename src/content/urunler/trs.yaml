ad: TRS
ozet: Hastanın kendi kanından elde edilen, trombin bakımından zengin otolog serum.
aile: tropocells
sira: 9
gizli: false
gorsel: /assets/img/urunler/trs/gorsel.png
gorselAlt: Tropocells PRP tüpleri ve enjektör
bloklar:
  - discriminant: etiketler
    value:
      etiketler:
        - Otolog
        - Minimal invaziv
        - Kombinasyona uygun
  - discriminant: metin
    value:
      metin: >-
        ## TRS nedir?


        TRS (Thrombin&#8209;Rich Serum), hastanın kendi kanından elde edilen
        otolog bir üründür. Kanın pıhtılaşma sürecindeki kilit enzim olan
        trombin bakımından zengindir.


        Kalsiyum glukonat eklenerek pıhtılaşma süreci tetiklenir ve PDGF,
        TGF&#8209;beta gibi büyüme faktörleri serbest bırakılır.


        ## Uygulama alanları
  - discriminant: kutular
    value:
      ustBosluk: 0
      kutular:
        - baslik: Yara iyileşmesi
          maddeler:
            - Kronik ülserler
            - Cerrahi yaralar
        - baslik: Estetik ve anti&#8209;aging
          maddeler:
            - Cilt yenileme
            - Leke tedavisi
            - Kolajen sentezi
        - baslik: Diş hekimliği
          maddeler:
            - Çekim sonrası iyileşme desteği
        - baslik: Kombinasyon
          maddeler:
            - PRGF, PRF veya Exo&#8209;ME ile sinerjik etki
  - discriminant: metin
    value:
      metin: '## Neden TRS?'
  - discriminant: maddeler
    value:
      maddeler:
        - Hastanın kendi kanından elde edilir, yabancı madde içermez
        - PDGF ve TGF&#8209;beta büyüme faktörlerini aktive eder
        - Hücre yenilenmesini ve doku iyileşmesini uyarır
        - Minimal invaziv
        - Diğer otolog tedavilerle kombinasyon mümkün
