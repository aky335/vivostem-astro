        ## PRF nedir?

        PRF (Platelet Rich Fibrin), pıhtılaşma faktörleri ve büyüme faktörlerini içeren fibrin membrandır. Santrifüj işlemiyle elde edilen PRF, büyüme faktörlerini yavaş yavaş serbest bırakarak doku iyileşmesini uzun süreli destekler.

        ## Endikasyonlar
