notVurgu: "Klinik karşılığı:"
notMetin: "Farklı hastalarda ve farklı seanslarda karşılaştırılabilir ürün kalitesi. Kliniğin uygulama standardını kişiye bağlı olmaktan çıkarır."
detay: |-
  Cellenis<sup>&reg;</sup> PRGF sistemi, kan alımından biyolojik ürünün hazırlanmasına kadar kapalı sistem prensibiyle çalışır. Hazırlık süreci hiçbir aşamada açık ortama temas etmez.

  Bu yaklaşım iki şey sağlar. Birincisi kontaminasyon riskinin minimum seviyeye indirilmesi. İkincisi, uygulamayı yapan hekimden bağımsız olarak sürecin aynı adımlarla ilerlemesi; yani protokolün tekrarlanabilir olması.
