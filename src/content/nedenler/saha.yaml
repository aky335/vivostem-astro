detay: |-
  Vivostem Medikal, portföyündeki markaların Türkiye distribütörüdür. Bu, orijinal ürün güvencesi ve tedarik sürekliliği anlamına gelir. Ürünler, dermatolojiden veteriner hekimliğe uzanan branşlarda 60'tan fazla ülkede kullanılıyor.

  Satış sonrası süreç teslimatla bitmiyor. Uygulama sırasında ortaya çıkan sorularda saha ekibimize doğrudan ulaşabilir, hasta seçimi ve seans planlaması konusunda görüş alabilirsiniz.
