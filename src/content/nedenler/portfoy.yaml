detay: |-
  <a href="/cellenis-prgf">Cellenis<sup>&reg;</sup> PRGF</a>, <a href="/cellenis-prf">PRF</a>, <a href="/cellenis-dermafiller">DermaFiller</a> ve <a href="/cellenis-exo-me">Exo&#8209;ME</a>; <a href="/tropocells-prp">Tropocells<sup>&reg;</sup> PRP</a>, <a href="/tropovisc">TropoVisc<sup>&trade;</sup></a> ve <a href="/trs">TRS</a>; veteriner hekimlik için <a href="/tropovet">TropoVet<sup>&reg;</sup></a>; rejeneratif cerrahi için <a href="/svf">SVF</a> ve <a href="/bmac">BMAC</a>. Farklı branşların ihtiyacı tek bir tedarik ve destek hattından karşılanır.

  Ürünler birbirinin alternatifi değil, tamamlayıcısıdır. PRGF ile PRF kombine kullanıldığında sinerjik etki oluşur; BioFiller anlık hacim desteği verirken içeriğindeki PRGF kolajen ve elastin üretimini destekler; TRS, PRGF ve Exo&#8209;ME ile birlikte uygulanabilir.
