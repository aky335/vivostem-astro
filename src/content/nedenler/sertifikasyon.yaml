detay: |-
  Portföyümüzdeki ürünler FDA onayı, CE Class IIb sertifikasyonu, ISO 13485 kalite yönetim sistemi ve GMP koşullarında üretim standartlarıyla geliştirilmiştir.

  Cellenis<sup>&reg;</sup> yalnızca bir kan ayrıştırma tüpü değil, biyolojik ürünün güvenli şekilde hazırlanıp yeniden uygulanmasına yönelik geliştirilmiş bir medikal sistemdir. Tıbbi cihaz seçiminde bu ayrım, hem hasta güvenliği hem de hukuki sorumluluk açısından belirleyicidir.

  - FDA onayı
  - CE Class IIb sertifikasyonu
  - ISO 13485 kalite yönetim sistemi
  - GMP koşullarında üretim
