notMetin: "Yeni bir uygulamayı denemenin öğrenme maliyeti kliniğin üzerinde kalmaz. Ürün, kliniğinize uygulanabilir bir yöntemle birlikte gelir. <a href=\"/saglik-profesyonelleri\">Eğitim programlarına bakın.</a>"
detay: |-
  Bir rejeneratif ürünün klinik sonucu, ürünün kendisi kadar uygulama protokolüne bağlıdır. Bu nedenle Vivostem Türkiye olarak sağlık profesyonellerine yalnızca ürün tedariki yapmıyoruz.

  - Kliniğinizde veya merkezimizde uygulamalı hands&#8209;on workshop
  - Cellenis Exo&#8209;ME, Tropocells PRP ve rejeneratif diş hekimliği başlıklarında periyodik webinar
  - Endikasyon, seans planı ve hazırlık adımlarını içeren yazılı klinik protokoller
  - İlk uygulamalarda uzman eğitmen desteği ve Medikod Expert Days katılımı
